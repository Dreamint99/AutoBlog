name: Hot keyword article (daily)

# ONE extra article per site per day on the top trending keyword that fits the
# site (generator/modules/trend_radar.py: Google Trends RSS + Wikipedia + HN +
# Autocomplete, filtered by the LLM). 06:30 UTC = 12:30 BST.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites (space separated)"
        default: "infkey countly walvi ninetymins probashiinfo"
      dry_run:
        description: "Only print the trending picks"
        type: boolean
        default: false

concurrency:
  group: autoblog-drip
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install wrangler (for D1 writes)
        run: npm install -g wrangler@4
      - name: Ensure D1 indexes (keeps page reads inside the free 5M rows/day)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          wrangler d1 execute autoblog-content --remote --command
          "CREATE INDEX IF NOT EXISTS idx_articles_site_status_created ON articles(site_id, status, created_at);
          CREATE INDEX IF NOT EXISTS idx_articles_site_slug ON articles(site_id, slug);" || true
      - name: Pick trending keyword + write + publish
        env:
          STORAGE_BACKEND: d1
          # Free-tier fallback chain (see generator/config/settings.py LLM_CHAIN):
          # Gemini → Mistral → Groq → Cerebras → OpenRouter free → DeepSeek.
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          SITES="${{ github.event.inputs.sites || 'infkey countly walvi ninetymins probashiinfo' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python hot_drip.py $SITES --dry-run
          else
            python hot_drip.py $SITES
          fi
