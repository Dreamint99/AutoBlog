name: Network dashboard stats

# Hourly: collect every site's real numbers (articles, uptime, visitors when analytics tokens exist)
# and POST them to the private dashboard at probashiinfo.com/network-dashboard/ (admins only).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: generator
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
      PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
      PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests && npm install -g wrangler@4
      - run: python network_stats.py collect
