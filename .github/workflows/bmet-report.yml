name: BMET daily report (probashiinfo)

# 18:20 UTC = 00:20 BST, just after midnight in Bangladesh: fetch the day that just ended from OEP
# (and refresh the last 3 days for late entries), commit the history, update the /bmet-report/
# dashboard and publish that day's dated article. Saturday 00:20 also the weekly report (Sat–Fri),
# the 1st of each month the monthly one. 03:15 UTC = 09:15 BST re-runs the same steps so late
# OEP entries correct the dashboard and the same articles (updated in place by slug).
# Today's running count is live on the dashboard itself (snippet #15 polls /wp-json/pa/v1/bmet-live).
on:
  schedule:
    - cron: "20 18 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Days to (re)fetch"
        default: "3"
      post:
        description: "daily, weekly, monthly or none"
        default: "daily"
      notify:
        description: "push: auto (midnight run only), test, daily or none"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: bmet-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    env:
      PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
      PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
      PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow pywebpush
      - name: Collect
        run: python bmet_report.py collect --backfill "${{ github.event.inputs.backfill || '3' }}"
      - name: Save history
        run: |
          git config user.name "autoblog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bmet.json
          git diff --cached --quiet || { git commit -m "BMET data $(date -u +%F)"; git pull --rebase -q; git push -q; }
      - name: Update dashboard
        run: python bmet_report.py push
      - name: Publish articles
        run: |
          P="${{ github.event.inputs.post || 'daily' }}"
          [ "$P" = "none" ] && exit 0
          python bmet_report.py post $P
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "$(TZ=Asia/Dhaka date +%u)" = "6" ] && python bmet_report.py post weekly || true
            [ "$(TZ=Asia/Dhaka date +%d)" = "01" ] && python bmet_report.py post monthly || true
          fi
      - name: Push notification
        if: always()
        run: |
          N="${{ github.event.inputs.notify || 'auto' }}"
          if [ "$N" = "auto" ]; then
            # midnight run (18:xx UTC): tell subscribers the new report is out
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" -ge 18 ]; then python bmet_report.py notify daily; fi
          elif [ "$N" != "none" ]; then
            python bmet_report.py notify "$N"
          fi
