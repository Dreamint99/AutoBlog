name: Cloudflare WAF rule (block scanners)

# Manual: (re)apply the scanner / PHP-probe block rule on every network zone (generator/cf_waf.py).
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (only report)"
        type: boolean
        default: false

jobs:
  waf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python cf_waf.py ${{ inputs.dry && '--dry' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
