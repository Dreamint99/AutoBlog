name: Passport Index (weekly rebuild -> D1)

# Rebuilds the VisaPoint Passport Index from public visa-policy data and stores
# it in D1 (pi_passport / pi_meta). The site reads D1, so no redeploy is needed.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: passport-index
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycountry
      - run: npm install -g wrangler@4
      - name: Rebuild and store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONUTF8: "1"
        run: python generator/passport_index.py
