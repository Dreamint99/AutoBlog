name: Walvi daily auto-post

# Runs in GitHub's cloud — generates + publishes even when your PC is OFF.
# Each run writes ONE new, keyword-researched, SEO article to Supabase via the
# full 3-agent DeepSeek pipeline (strategist → writer → optimizer + images +
# internal links + IndexNow ping to Bing/Yandex).
#
# 8 runs/day, spread across the day (a gentle DRIP, not a burst — Google treats
# bursts of AI content as "scaled content abuse"). cron is UTC; Bangladesh=UTC+6.
#   01:00 UTC = 07:00 BST | 03:30 = 09:30 | 06:00 = 12:00 | 08:30 = 14:30
#   11:00 UTC = 17:00 BST | 13:30 = 19:30 | 16:00 = 22:00 | 18:30 = 00:30
#
# TUNE THE DAILY VOLUME: add/remove `- cron:` lines below (1 line = +1 post/day).
# For a fresh domain, fewer (2–4/day) is safer; raise it once the site has
# authority. Generation stops automatically once Walvi reaches TARGET (200).
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 3 * * *"
    - cron: "0 6 * * *"
    - cron: "30 8 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"
    - cron: "0 16 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to generate this run (manual trigger)"
        required: false
        default: "1"

concurrency:
  group: walvi-drip
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate + publish Walvi article(s)
        env:
          STORAGE_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INDEXNOW_HOSTS: walvi.io
          PYTHONUTF8: "1"
        # drip.py walvi <count-per-run> <target-total>. Stops at TARGET.
        run: python drip.py walvi ${{ github.event.inputs.count || '1' }} 200
