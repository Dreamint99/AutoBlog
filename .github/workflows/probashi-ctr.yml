name: probashiinfo CTR titles

# Manual: rewrite Rank Math titles/descriptions of high-impression, low-CTR posts
# (generator/wp_ctr.py). Dry run unless "apply" is ticked; the change log is committed.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to WordPress (otherwise dry run)"
        type: boolean
        default: false
      limit:
        description: "Max posts (0 = all targets)"
        default: "0"

concurrency:
  group: probashi-ctr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ctr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Rewrite snippets
        env:
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APPLY: ${{ github.event.inputs.apply }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ "$APPLY" = "true" ]; then python wp_ctr.py --apply "$LIMIT"; else python wp_ctr.py "$LIMIT"; fi
      - name: Commit change log
        if: github.event.inputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ctr_log_probashiinfo.json
          git diff --cached --quiet || (git commit -m "probashiinfo: CTR title log" && git pull --rebase && git push)
