name: Publish exact titles

# Manual: publish articles with the exact titles given (pipe-separated).
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site id"
        default: "walvi"
      titles:
        description: "Titles separated by |"
        required: true
      tag:
        description: "Optional category tag (first tag)"
        default: ""
      style:
        description: "Optional extra writing guidance"
        default: ""

concurrency:
  group: publish-titles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install -g wrangler@4
      - name: Write and publish
        env:
          STORAGE_BACKEND: d1
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
          SITE: ${{ github.event.inputs.site }}
          TITLES: ${{ github.event.inputs.titles }}
          TAG: ${{ github.event.inputs.tag }}
          DRIP_STYLE: ${{ github.event.inputs.style }}
        run: python publish_titles.py "$SITE" "$TITLES" "$TAG"
