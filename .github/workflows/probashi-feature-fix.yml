name: probashiinfo feature images

# Manual: replace off-topic stock feature/inline images with on-topic ones
# (generator/wp_feature_fix.py). Dry run unless "apply" is ticked; progress is committed.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to WordPress (otherwise dry run)"
        type: boolean
        default: false
      limit:
        description: "Max posts (0 = all)"
        default: "0"
      recheck:
        description: "Recheck photos placed earlier against the stricter rules"
        type: boolean
        default: false

concurrency:
  group: probashi-feature-fix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Bengali fonts for the title cards
        run: sudo apt-get install -y -qq fonts-noto-core fonts-beng >/dev/null || true
      - name: Fix images
        env:
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          CHROME_BIN: /usr/bin/google-chrome
          APPLY: ${{ github.event.inputs.apply }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          R=""; if [ "${{ github.event.inputs.recheck }}" = "true" ]; then R="--recheck"; fi
          if [ "$APPLY" = "true" ]; then python wp_feature_fix.py $R --apply "$LIMIT"; else python wp_feature_fix.py $R "$LIMIT"; fi
      - name: Commit progress
        if: always() && github.event.inputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feature_fix_probashiinfo.json
          git diff --cached --quiet || (git commit -m "probashiinfo: feature image progress" && git pull --rebase && git push)
