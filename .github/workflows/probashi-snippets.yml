name: probashiinfo snippets (find & replace)

# Edits probashiinfo.com Code Snippets in place through the plugin REST API,
# e.g. move promo links to a new domain. Dry run unless "apply" is ticked.
on:
  workflow_dispatch:
    inputs:
      find:
        description: "Text to find"
        default: "https://probashi-bondhu.vercel.app"
      replace:
        description: "Replace with"
        default: "https://www.probashibondu.online"
      upsert_file:
        description: "Instead: create/replace a snippet from generator/wp_snippets/<file> (name = upsert_name)"
        default: ""
      cleanup:
        description: "Space-separated ids of INACTIVE duplicate snippets to delete"
        default: ""
      upsert_name:
        description: "Snippet name for upsert"
        default: ""
      apply:
        description: "Apply the change (otherwise dry run)"
        type: boolean
        default: false

jobs:
  snippets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: List + replace
        env:
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          FIND: ${{ github.event.inputs.find }}
          REPL: ${{ github.event.inputs.replace }}
          UFILE: ${{ github.event.inputs.upsert_file }}
          UNAME: ${{ github.event.inputs.upsert_name }}
        run: |
          if [ -n "${{ github.event.inputs.cleanup }}" ]; then
            for i in ${{ github.event.inputs.cleanup }}; do python wp_snippets.py delete-inactive-copy $i; done
          fi
          if [ -n "$UFILE" ]; then
            php -l "wp_snippets/$UFILE" && python wp_snippets.py upsert "$UNAME" "wp_snippets/$UFILE"
            exit $?
          fi
          python wp_snippets.py list
          python wp_snippets.py show "$FIND" | head -20
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python wp_snippets.py replace "$FIND" "$REPL" --apply
          else
            python wp_snippets.py replace "$FIND" "$REPL"
          fi
