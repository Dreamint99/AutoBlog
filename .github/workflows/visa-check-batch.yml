name: VisaPoint Visa Check guides

# "How to check <Country> visa status online" guides, one per entry in
# web/src/data/visa-check.json that has no guide yet. Daily: 2 new guides
# (drip, not dump). Manual run: set "count" or a space-separated list of slugs.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Count (e.g. 5) or slugs (e.g. qatar serbia moldova)"
        default: "3"

concurrency:
  group: visa-check-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install -g wrangler@4
      - name: Write and publish guides
        env:
          STORAGE_BACKEND: d1
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
          ARGS: ${{ github.event.inputs.args || '2' }}
        run: python visa_check_batch.py $ARGS
