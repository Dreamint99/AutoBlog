name: probashiinfo SEO apply n1123

# One-off: apply Rank Math overrides, then title/intro/FAQ updates. Does not commit or push.
on:
  workflow_dispatch:

concurrency:
  group: probashi-n1123
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply
        env:
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
        run: |
          python wp_ctr.py --overrides
          python wp_seo_n1123.py --apply
