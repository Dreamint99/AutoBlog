name: ninetymins preview

# Upload a Worker version and a preview alias. Does not create a production deployment.
on:
  workflow_dispatch:

concurrency:
  group: ninetymins-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Write wrangler config without production routes
        run: |
          cat > wrangler.jsonc << 'EOF'
          {
            "name": "autoblog-ninetymins",
            "main": "cache-worker.js",
            "compatibility_date": "2026-06-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": { "directory": ".open-next/assets", "binding": "ASSETS", "html_handling": "none" },
            "d1_databases": [
              { "binding": "DB", "database_name": "autoblog-content", "database_id": "58dacf96-c574-4f0b-88e6-3005d895eb90" }
            ],
            "vars": { "SITE_ID": "ninetymins" },
            "version_metadata": { "binding": "CF_VERSION_METADATA" },
            "workers_dev": true
          }
          EOF
      - name: OpenNext build
        env:
          SITE_ID: ninetymins
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
      - name: Upload version preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions upload --preview-alias nm-events --message "preview event hubs ${{ github.sha }}"
