name: Colours of Bangladesh auto news
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "max stories this run"
        default: "3"
      backfill:
        description: "give N old text-card stories a real photo (0 = normal run)"
        default: "0"
concurrency: { group: banglatimeline-news, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: banglatimeline-news } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get install -y -qq fonts-beng >/dev/null || true
      - run: node run.mjs --max "${{ github.event.inputs.max || '3' }}" --backfill "${{ github.event.inputs.backfill || '0' }}" ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: deepseek/deepseek-v4-flash
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INGEST_TOKEN: ${{ secrets.BTL_INGEST_TOKEN }}
          SITE: ${{ secrets.BTL_SITE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DAILY_LIMIT: "20"
          DAILY_MIN: "15"
          CHROME: /usr/bin/google-chrome
