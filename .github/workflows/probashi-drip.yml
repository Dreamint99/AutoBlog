name: Probashi daily auto-post

# Runs in GitHub's cloud — posts even when your PC is OFF.
# 3 Bengali posts/day (cron is UTC; Bangladesh = UTC+6):
#   03:30 UTC = 09:30 BST (general)  |  09:30 UTC = 15:30 BST (today's trending keyword)
#   13:30 UTC = 19:30 BST (general)
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

concurrency:
  group: probashi-drip
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate + publish 1 Bengali post
        env:
          STORAGE_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free-tier chain: Gemini → Mistral → Groq → Cerebras → OpenRouter → DeepSeek;
          # a provider that is out of quota/balance is skipped automatically.
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          PROBASHIINFO_WP_RANKMATH: "1"
          PYTHONUTF8: "1"
        # Fail loudly when nothing was published (e.g. every LLM out of quota), instead of a green run.
        run: |
          if [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            # trending-keyword post; fall back to a normal post if no trend fits today
            python hot_drip.py probashiinfo 2>&1 | tee drip.log || python drip.py probashiinfo 1 999999 2>&1 | tee drip.log
            grep -q "✅" drip.log || { echo "::error::No article published"; exit 1; }
            exit 0
          fi
          # 03:30 and 13:30: a step-by-step work-visa guide for the next BMET destination country that has none yet
          # (generator/data/coverage_probashiinfo_visa.json, ordered by BMET volume); a normal topic once all are covered.
          DRIP_COVERAGE=probashiinfo_visa python drip.py probashiinfo 1 999999 2>&1 | tee drip.log
          grep -q "+0 article(s)" drip.log && { echo "::error::No article published"; exit 1; } || true
