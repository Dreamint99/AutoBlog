name: Verify sites (read-only)

# Read-only health check: homepage + one article per site (+ /api/scores on
# ninetymins), D1 indexes present, and D1 rows read per day (free tier = 5M/day).
# Never writes to D1.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: HTTP checks (cache-busted)
        run: |
          fail=0
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "$1"); echo "$code  $1"; [ "$code" = 200 ] || fail=1; }
          for d in countly.net ninetymins.com infkey.com; do
            check "https://$d/?v=$RANDOM$RANDOM"
            # First article URL from the sitemap (skips the homepage and static pages).
            art=$(curl -s "https://$d/sitemap.xml?v=$RANDOM" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' \
                  | grep -vE "^https?://(www\.)?$d/?$|/(about|contact|privacy|terms|disclaimer|topic|search)(/|$)" | head -1)
            if [ -n "$art" ]; then check "$art?v=$RANDOM$RANDOM"; else echo "no article URL in sitemap for $d"; fail=1; fi
          done
          check "https://ninetymins.com/api/scores?v=$RANDOM"
          curl -s "https://ninetymins.com/?v=$RANDOM$RANDOM" | grep -q nm-header && echo "ninetymins: new markup (nm-header)" || echo "ninetymins: OLD markup"
          curl -s "https://countly.net/?v=$RANDOM$RANDOM" | grep -q cx-masthead && echo "countly: cx-masthead present" || echo "countly: cx-masthead missing"
          echo "FAIL=$fail" >> "$GITHUB_ENV"

      - name: D1 indexes (SELECT only)
        run: |
          npx -y wrangler@4 d1 execute autoblog-content --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND tbl_name='articles'" \
            | jq -r '.[0].results[].name'

      - name: D1 rows read per day (last 7 days)
        run: |
          since=$(date -u -d '7 days ago' +%F); until=$(date -u +%F)
          q=$(jq -n --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$since" --arg u "$until" '{query:
            "query($a:String!,$s:Date!,$u:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:100,filter:{date_geq:$s,date_leq:$u},orderBy:[date_ASC]){sum{rowsRead rowsWritten readQueries} dimensions{date}}}}}",
            variables:{a:$a,s:$s,u:$u}}')
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            https://api.cloudflare.com/client/v4/graphql -d "$q" > d1.json
          jq -r '.errors // empty' d1.json
          jq -r '.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | "\(.dimensions.date)  rowsRead=\(.sum.rowsRead)  queries=\(.sum.readQueries)  rowsWritten=\(.sum.rowsWritten)"' d1.json

      - name: Result
        run: exit $FAIL
