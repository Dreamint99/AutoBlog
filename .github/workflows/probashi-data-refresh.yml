name: probashiinfo data refresh

# Weekly: re-read the BMET RAIMS recruiting-agency list (licence status / expiry), rebuild
# probashi-data/data/agency.json (existing release dates never move) and load it into D1
# (pbd_agency), which the probashi-data Worker reads for probashiinfo.com /agency/ pages.
# No worker deploy needed. Commits only when data changed.
on:
  schedule:
    - cron: "10 3 * * 1"
  workflow_dispatch:
    inputs:
      force_load:
        description: "Load D1 even when the data did not change (tests the Cloudflare token)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: probashi-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests
      - name: Fetch + rebuild
        working-directory: probashi-data
        env:
          PYTHONUTF8: "1"
        run: |
          python fetch_agencies.py
          python build_agency.py
      - name: Load D1 + commit when data changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          changed=1; git diff --quiet -- probashi-data/data/agency.json && changed=0
          if [ "$changed" = 0 ] && [ "${{ github.event.inputs.force_load }}" != "true" ]; then echo "agency list unchanged"; exit 0; fi
          npm install -g wrangler@4
          (cd workers/probashi-data && wrangler d1 execute autoblog-content --remote --file ../../probashi-data/data/agency.sql -y)
          if [ "$changed" = 0 ]; then echo "loaded (forced), nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probashi-data/data/agency.json probashi-data/data/agency.sql probashi-data/research/agencies.json
          git commit -m "probashiinfo agency list $(date -u +%F)"
          git pull --rebase && git push

  # /embassy/ pages: compare the MOFA mission list with the data inside the PBD snippet. A country page
  # (kind=country) turns into a mission page under the same slug when MOFA lists a new mission there.
  embassy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: MOFA mission list -> /embassy/ pages
        working-directory: generator
        env:
          PYTHONUTF8: "1"
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          PBD_TEST_KEY: ${{ secrets.PBD_TEST_KEY }}
        run: |
          python embassy_refresh.py
          if [ ! -s wp_snippets/embassy-changed.txt ]; then echo "embassy list unchanged"; exit 0; fi
          php -l wp_snippets/pbd-data-pages.php
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wp_snippets/pbd-data-pages.php wp_snippets/embassy-changed.txt
          git commit -m "probashiinfo embassy pages: new MOFA mission(s) $(date -u +%F)"
          git pull --rebase && git push
          python wp_probashi_data.py backup "auto-embassy $(date -u +%F)"
          python wp_probashi_data.py push wp_snippets/pbd-data-pages.php on
          python wp_probashi_data.py flush
          python wp_probashi_data.py indexnow wp_snippets/embassy-changed.txt
