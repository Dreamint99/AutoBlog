name: Content update (fill pillars + refresh stale)

# Free LLM chain. Daily 03:00 UTC (09:00 BST):
#   fill    — writes articles for pillar keywords that have none (generator/pillars.json)
#   refresh — rewrites the stalest posts IN PLACE (same URL): past-year titles first,
#             then anything older than 60 days. Keeps every site current automatically.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "fill or refresh"
        default: "fill"
      site:
        description: "site id or all"
        default: "infkey"
      count:
        description: "articles per site"
        default: "6"

concurrency:
  group: autoblog-drip
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install wrangler (for D1 writes)
        run: npm install -g wrangler@4
      - name: Ensure D1 indexes (keeps page reads inside the free 5M rows/day)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          wrangler d1 execute autoblog-content --remote --command
          "CREATE INDEX IF NOT EXISTS idx_articles_site_status_created ON articles(site_id, status, created_at);
          CREATE INDEX IF NOT EXISTS idx_articles_site_slug ON articles(site_id, slug);" || true
      - name: Fill pillars + refresh stale content
        env:
          STORAGE_BACKEND: d1
          # Free-tier fallback chain (see generator/config/settings.py LLM_CHAIN):
          # Gemini → Mistral → Groq → Cerebras → OpenRouter free → DeepSeek.
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python content_update.py "${{ github.event.inputs.job }}" "${{ github.event.inputs.site }}" "${{ github.event.inputs.count }}"
            exit 0
          fi
          python content_update.py fill infkey 2 || true
          for s in countly walvi ninetymins; do python content_update.py fill $s 1 || true; done
          python content_update.py refresh all 1 --days 60 || true
