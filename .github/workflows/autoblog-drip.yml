name: AutoBlog daily auto-post (D1)

# Runs in GitHub's cloud — publishes even when the PC is OFF.
# Writes straight to Cloudflare D1 (the live store). Times are UTC; BST = UTC+6.
#   15:00 UTC = 21:00 BST   |   20:00 UTC = 02:00 BST
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
    # NinetyMins-only 3rd daily article (09:30 UTC = 15:30 BST).
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      per_site:
        description: "Articles per site this run"
        default: "1"

concurrency:
  group: autoblog-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install wrangler (for D1 writes)
        run: npm install -g wrangler@4
      - name: Ensure D1 indexes (keeps page reads inside the free 5M rows/day)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          wrangler d1 execute autoblog-content --remote --command
          "CREATE INDEX IF NOT EXISTS idx_articles_site_status_created ON articles(site_id, status, created_at);
          CREATE INDEX IF NOT EXISTS idx_articles_site_slug ON articles(site_id, slug);" || true
      - name: Research + write + publish to D1
        env:
          STORAGE_BACKEND: d1
          # Free-tier fallback chain (see generator/config/settings.py LLM_CHAIN):
          # Gemini → Mistral → Groq → Cerebras → OpenRouter free → DeepSeek.
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          # 2 runs/day × N=1 → 2 new articles per site per day (+1 NinetyMins at 09:30).
          N="${{ github.event.inputs.per_site || '1' }}"
          FAIL=0
          if [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            # NinetyMins 3rd article: a South Asia / cricket angle, rotating daily.
            NM=(
              "SAFF Championship and South Asian national football teams (Bangladesh, India, Nepal, Maldives) — fixtures, results, history"
              "cricket match today — fixtures, start times by timezone and where to watch legally"
              "Bangladesh national football team — upcoming matches, squad news and how to watch"
              "Bangladesh cricket team — upcoming series, schedule and where to watch"
              "Indian Super League and AFC competitions — fixtures and how to watch"
            )
            SEED="${NM[$(( $(date +%j | sed 's/^0*//') % ${#NM[@]} ))]}"
            python drip.py ninetymins 1 500 "$SEED" || exit 1
            exit 0
          fi
          # drip_enabled sites (infkey, ninetymins) — N general each.
          python drip.py all "$N" 500 || FAIL=1
          # GCCGuide: one extra article per run, picked from the country x topic coverage matrix
          # (generator/data/coverage_gccguide.json) so all six Gulf countries fill up evenly.
          python drip.py gccguide 1 500 || FAIL=1
          # Countly: the 20:00 run takes the wealth category, the 15:00 run a general topic.
          # The wealth angle rotates daily — one fixed seed produced near-duplicate titles
          # ("Richest billionaires net worth: Top 10 …") that cannibalise each other.
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            WEALTH=(
              "richest people in a specific country (pick a country not yet covered) net worth ranking"
              "richest women in the world self-made female billionaires ranking"
              "richest tech founders and AI billionaires net worth ranking"
              "youngest billionaires under 40 net worth ranking"
              "richest families and dynasties in the world wealth ranking"
              "biggest billionaire net worth gains and losses this year ranking"
              "richest sports team owners and athletes net worth ranking"
              "richest people in Asia or the Middle East by country net worth ranking"
            )
            SEED="${WEALTH[$(( $(date +%j | sed 's/^0*//') % ${#WEALTH[@]} ))]}"
            python drip.py countly "$N" 500 "$SEED" || FAIL=1
          else
            python drip.py countly "$N" 500 || FAIL=1
          fi
          # Best AI Tools directory — refresh live GitHub stars + trending repos.
          python gen_ai_tools_d1.py --all || true
          # Red run (and a GitHub email) when an enabled site published nothing.
          exit $FAIL
