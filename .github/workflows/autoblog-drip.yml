name: AutoBlog daily auto-post (D1)

# Runs in GitHub's cloud — publishes even when the PC is OFF.
# Writes straight to Cloudflare D1 (the live store). Times are UTC; BST = UTC+6.
#   15:00 UTC = 21:00 BST   |   20:00 UTC = 02:00 BST
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      per_site:
        description: "Articles per site this run"
        default: "1"

concurrency:
  group: autoblog-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install wrangler (for D1 writes)
        run: npm install -g wrangler@4
      - name: Research + write + publish to D1
        env:
          STORAGE_BACKEND: d1
          # Free-tier fallback chain (see generator/config/settings.py LLM_CHAIN):
          # Gemini → Mistral → Groq → Cerebras → OpenRouter free → DeepSeek.
          LLM_PROVIDER: chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
        run: |
          # 2 runs/day × N=1 → 2 new articles per site per day.
          N="${{ github.event.inputs.per_site || '1' }}"
          FAIL=0
          # drip_enabled sites (infkey, ninetymins) — N general each.
          python drip.py all "$N" 500 || FAIL=1
          # Countly: the 20:00 run takes the "richest" wealth category, the 15:00 run a general topic.
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            python drip.py countly "$N" 500 "richest billionaires net worth wealth ranking" || FAIL=1
          else
            python drip.py countly "$N" 500 || FAIL=1
          fi
          # Best AI Tools directory — refresh live GitHub stars + trending repos.
          python gen_ai_tools_d1.py --all || true
          # Red run (and a GitHub email) when an enabled site published nothing.
          exit $FAIL
