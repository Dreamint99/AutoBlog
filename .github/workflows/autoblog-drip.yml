name: AutoBlog daily auto-post (D1)

# Runs in GitHub's cloud — publishes even when the PC is OFF.
# Writes straight to Cloudflare D1 (the live store). Times are UTC; BST = UTC+6.
#   15:00 UTC = 21:00 BST   |   20:00 UTC = 02:00 BST
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      per_site:
        description: "Articles per site this run"
        default: "2"

concurrency:
  group: autoblog-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install wrangler (for D1 writes)
        run: npm install -g wrangler@4
      - name: Research + write + publish to D1
        env:
          STORAGE_BACKEND: d1
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_PROVIDER: pixabay
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUTF8: "1"
        run: python drip.py all ${{ github.event.inputs.per_site || '2' }} 500
