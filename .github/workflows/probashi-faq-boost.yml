name: probashiinfo FAQ boost

# Manual: answer the real Search Console queries a post ranks 8+ for, inside that post
# (generator/wp_faq_boost.py). Dry run unless "apply" is ticked.
on:
  schedule:
    - cron: "41 3 * * 3"  # weekly, after the Monday Search Console pull
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply to WordPress (otherwise dry run)"
        type: boolean
        default: false
      limit:
        description: "Max posts (0 = all)"
        default: "0"

concurrency:
  group: probashi-faq-boost
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          PROBASHIINFO_WP_URL: ${{ secrets.PROBASHIINFO_WP_URL }}
          PROBASHIINFO_WP_USER: ${{ secrets.PROBASHIINFO_WP_USER }}
          PROBASHIINFO_WP_APP_PASSWORD: ${{ secrets.PROBASHIINFO_WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || github.event.inputs.apply == 'true' }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
        run: |
          if [ "$APPLY" = "true" ]; then python wp_faq_boost.py --apply "$LIMIT"; else python wp_faq_boost.py "$LIMIT"; fi
