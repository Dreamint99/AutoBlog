<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700;800&family=Hind+Siliguri:wght@500;600&family=Inter:wght@600&display=swap" rel="stylesheet">
<!-- Featured image (16:9, 1600×900) for stories without a usable photo — same look as the Facebook card.
     run.mjs → window.fill({title, kicker, cat, catBn, date}); sets window.ready. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:900px;overflow:hidden;background:#07090b}
  .c{--cc:#e11d2e;position:relative;width:1600px;height:900px;overflow:hidden;color:#fff;font-family:"Hind Siliguri",sans-serif;
     background:radial-gradient(1100px 700px at 92% 0%,color-mix(in srgb,var(--cc) 62%,transparent),transparent 62%),
                radial-gradient(900px 600px at 0% 110%,color-mix(in srgb,var(--cc) 30%,transparent),transparent 65%),
                linear-gradient(155deg,#121820,#07090b 72%)}
  .beam{position:absolute;inset:-300px;background:repeating-linear-gradient(115deg,transparent 0 130px,rgba(255,255,255,.028) 130px 134px)}
  .mark{position:absolute;right:-30px;top:40px;font:800 340px/1 "Anek Bangla";color:color-mix(in srgb,var(--cc) 20%,transparent);white-space:nowrap}
  .grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(255,255,255,.13);border-radius:26px}
  .top{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center}
  .top img{height:62px}.top span{font:600 26px "Hind Siliguri";color:rgba(255,255,255,.85)}
  .story{position:absolute;left:72px;right:150px;bottom:120px}
  .tag{display:flex;align-items:center;gap:16px;margin-bottom:26px}
  .pill{background:var(--cc);font:700 30px "Anek Bangla";padding:8px 22px;border-radius:10px;box-shadow:0 12px 34px -10px var(--cc)}
  .kick{font:600 30px "Anek Bangla";color:color-mix(in srgb,var(--cc) 45%,#fff)}.kick:empty{display:none}
  h1{font:800 82px/1.2 "Anek Bangla";text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.4)}
  .rule{width:130px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--cc),color-mix(in srgb,var(--cc) 30%,#fff));margin-top:30px}
  .brand{position:absolute;right:72px;bottom:62px;font:600 22px Inter,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.6)}
  .spectrum{position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(90deg,#d0102b,#f2711c,#d99a00,#1f9d55,#1b6fd8,#7b3fe4,#e6338f)}
</style>
<div class="c" id="c"><div class="beam"></div><div class="mark" id="mark"></div><div class="grain"></div><div class="frame"></div>
  <div class="top"><img src="/img/logo-light.png?v=3" alt=""><span id="date"></span></div>
  <div class="story" id="story"><div class="tag"><span class="pill" id="cat"></span><span class="kick" id="kick"></span></div><h1 id="t"></h1><div class="rule"></div></div>
  <span class="brand">COLOURS OF BANGLADESH</span><div class="spectrum"></div>
</div>
<script>
const COL = { national: "#e11d2e", politics: "#8b5cf6", country: "#22a565", international: "#2f7cf6", economy: "#14b8a6", sports: "#f97316", entertainment: "#ec4899",
  probash: "#eab308", tech: "#6366f1", health: "#10b981", tips: "#f59e0b", lifestyle: "#f43f5e", travel: "#06b6d4", culture: "#d4a017", opinion: "#94a3b8" };
window.fill = async (j) => {
  const c = document.getElementById("c"); c.style.setProperty("--cc", COL[j.cat] || COL.national);
  document.getElementById("cat").textContent = j.catBn; document.getElementById("mark").textContent = j.catBn;
  document.getElementById("kick").textContent = j.kicker && j.kicker !== j.catBn ? j.kicker : "";
  document.getElementById("date").textContent = j.date || "";
  const t = document.getElementById("t"); t.textContent = j.title;
  await document.fonts.ready;
  const story = document.getElementById("story"), maxH = 900 - 120 - 170;
  let size = 88; t.style.fontSize = size + "px";
  while ((story.offsetHeight > maxH || t.offsetHeight / parseFloat(getComputedStyle(t).lineHeight) > 3.1) && size > 50) { size -= 2; t.style.fontSize = size + "px"; }
  window.ready = true;
};
</script>
