<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Facebook photo card v2 (editorial / premium), 1080×1350.
     Filled by run.mjs → window.fill({title, kicker, summary, cat, catBn, photo, date, breaking, credit}); sets window.ready. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#07090b}
  .c{--cc:#e11d2e;position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;font-family:"Hind Siliguri",sans-serif;background:#07090b}

  /* picture: full bleed, slow cinematic grade */
  .bg{position:absolute;inset:0}
  .bg img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.06)}
  .noimg .bg{background:
      radial-gradient(900px 700px at 85% 8%,color-mix(in srgb,var(--cc) 70%,transparent),transparent 62%),
      radial-gradient(700px 600px at 0% 100%,color-mix(in srgb,var(--cc) 35%,transparent),transparent 65%),
      linear-gradient(160deg,#121820,#07090b 70%)}
  .noimg .mark{display:block}
  .mark{display:none;position:absolute;left:52px;top:170px;font:800 300px/1 "Anek Bangla";color:color-mix(in srgb,var(--cc) 22%,transparent);white-space:nowrap}
  .noimg .beam{display:block}
  .beam{display:none;position:absolute;inset:-200px;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.025) 120px 124px);}
  .shade{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(7,9,11,.72) 0%,rgba(7,9,11,0) 20%,rgba(7,9,11,0) 38%,rgba(7,9,11,.72) 58%,rgba(7,9,11,.97) 76%,#07090b 100%)}
  .grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .frame{position:absolute;inset:26px;border:1.5px solid rgba(255,255,255,.14);border-radius:28px;pointer-events:none}

  /* masthead */
  .top{position:absolute;left:64px;right:64px;top:62px;display:flex;align-items:center;justify-content:space-between}
  .logo{height:58px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .meta{display:flex;align-items:center;gap:14px;font:600 24px "Hind Siliguri";color:rgba(255,255,255,.88)}
  .brk{display:none;align-items:center;gap:12px;background:#e11d2e;padding:9px 20px 9px 16px;border-radius:999px;font:800 26px "Anek Bangla";box-shadow:0 10px 30px -8px rgba(225,29,46,.8)}
  .brk b{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.28)}
  .breaking .brk{display:inline-flex}

  /* story block */
  .story{position:absolute;left:64px;right:64px;bottom:150px}
  .tag{display:inline-flex;align-items:center;gap:14px;margin-bottom:26px}
  .tag .pill{background:var(--cc);color:#fff;font:700 27px "Anek Bangla";padding:8px 20px;border-radius:10px;box-shadow:0 12px 34px -10px var(--cc)}
  .tag .kick{font:600 28px "Anek Bangla";color:color-mix(in srgb,var(--cc) 45%,#fff)}
  .tag .kick:empty{display:none}
  h1{font:800 70px/1.22 "Anek Bangla";letter-spacing:0;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.45)}
  .rule{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cc),color-mix(in srgb,var(--cc) 30%,#fff));margin:30px 0 22px}
  .sum{font:500 29px/1.55 "Hind Siliguri";color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:900px}

  /* footer */
  .foot{position:absolute;left:64px;right:64px;bottom:62px;display:flex;align-items:center;justify-content:space-between;padding-top:24px;border-top:1px solid rgba(255,255,255,.14)}
  .foot .brand{font:600 22px Inter,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.7)}
  .foot .credit{font:500 18px "Hind Siliguri";color:rgba(255,255,255,.45);max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .spectrum{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#d0102b,#f2711c,#d99a00,#1f9d55,#1b6fd8,#7b3fe4,#e6338f)}
</style>
<div class="c" id="c">
  <div class="bg" id="bg"></div>
  <div class="beam"></div><div class="mark" id="mark"></div>
  <div class="shade"></div><div class="grain"></div><div class="frame"></div>
  <div class="top">
    <img class="logo" src="/img/logo-light.png?v=3" alt="">
    <div class="meta"><span class="brk"><b></b>ব্রেকিং নিউজ</span><span id="date"></span></div>
  </div>
  <div class="story" id="story">
    <div class="tag"><span class="pill" id="cat"></span><span class="kick" id="kick"></span></div>
    <h1 id="t"></h1>
    <div class="rule"></div>
    <p class="sum" id="s"></p>
  </div>
  <div class="foot"><span class="brand">COLOURS OF BANGLADESH</span><span class="credit" id="credit"></span></div>
  <div class="spectrum"></div>
</div>
<script>
const COL = { national: "#e11d2e", politics: "#8b5cf6", country: "#22a565", international: "#2f7cf6", economy: "#14b8a6", sports: "#f97316", entertainment: "#ec4899",
  probash: "#eab308", tech: "#6366f1", health: "#10b981", tips: "#f59e0b", lifestyle: "#f43f5e", travel: "#06b6d4", culture: "#d4a017", opinion: "#94a3b8" };
const load = (img) => new Promise((ok) => { if (img.complete && img.naturalWidth) return ok(); img.onload = img.onerror = () => ok(); });
window.fill = async (j) => {
  const c = document.getElementById("c");
  c.style.setProperty("--cc", COL[j.cat] || COL.national);
  if (j.breaking) c.classList.add("breaking");
  document.getElementById("cat").textContent = j.catBn; document.getElementById("mark").textContent = j.catBn;
  document.getElementById("kick").textContent = j.kicker && j.kicker !== j.catBn ? j.kicker : "";
  document.getElementById("date").textContent = j.date;
  document.getElementById("credit").textContent = j.credit || "";
  const t = document.getElementById("t"), s = document.getElementById("s");
  t.textContent = j.title; s.textContent = j.summary || "";
  if (j.photo) { const im = new Image(); im.src = j.photo; document.getElementById("bg").append(im); await load(im); if (!im.naturalWidth) { im.remove(); c.classList.add("noimg"); } }
  else c.classList.add("noimg");
  await document.fonts.ready; await Promise.all([...document.images].map(load));
  // headline: largest size that keeps the story block below the masthead (≤4 lines); drop the summary first if needed
  const story = document.getElementById("story"), maxH = 1350 - 150 - 190;
  const fits = () => story.offsetHeight <= maxH && t.offsetHeight / parseFloat(getComputedStyle(t).lineHeight) <= 4.1;
  let size = 76; t.style.fontSize = size + "px";
  while (!fits() && size > 50) { size -= 2; t.style.fontSize = size + "px"; }
  if (!fits()) { s.style.display = "none"; size = 76; t.style.fontSize = size + "px"; while (!fits() && size > 44) { size -= 2; t.style.fontSize = size + "px"; } }
  window.ready = true;
};
</script>
