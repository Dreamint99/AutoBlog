<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoBlog{% endblock %} · AutoBlog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">⚡ Auto<span>Blog</span></a>
    <nav>
      <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
      <a href="/generate" class="{{ 'active' if request.path.startswith('/generate') }}">Generate</a>
      <a href="/manage" class="{{ 'active' if request.path.startswith('/manage') or request.path.startswith('/edit') }}">Manage</a>
      <a href="/settings" class="{{ 'active' if request.path.startswith('/settings') }}">Settings</a>
    </nav>
    {% if not has_llm %}<span class="pill warn" title="Add DEEPSEEK_API_KEY to .env">mock mode</span>{% endif %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
